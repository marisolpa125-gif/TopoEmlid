name: Generar APK de prueba

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar Topo Emlid (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK para descarga
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/TopoEmlid-v0.3-debug.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TopoEmlid-v0.3-debug
          path: release/TopoEmlid-v0.3-debug.apk
          if-no-files-found: error
          retention-days: 30
