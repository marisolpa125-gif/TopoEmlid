# Nuevo run solicitado para generar un artefacto APK fresco desde GitHub Actions.
name: Generar APK de prueba

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Compilar Topo Emlid (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      - name: Verificar Catastro Nacional antes de compilar
        run: |
          python3 - <<'PY'
          import time
          import urllib.parse
          import urllib.request

          UA = {"User-Agent": "QGIS/3.40 TopoEmlid-WMS-check"}

          def fetch(url, timeout=20):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.geturl(), r.headers.get("Content-Type", ""), r.read()

          # 1) Confirmar que GetCapabilities realmente publica las 3 capas SIRI.
          capabilities = (
              "https://siri.snitcr.go.cr/Geoservicios/wms"
              "?service=WMS&request=GetCapabilities&version=1.1.1"
          )
          cap_ok = False
          cap_body = b""
          for attempt in range(1, 9):
              try:
                  final_url, ctype, cap_body = fetch(
                      capabilities + f"&_check={time.time_ns()}"
                  )
                  text = cap_body.decode("utf-8", "ignore")
                  if (
                      "/Geoservicios/error" not in final_url
                      and "catastro" in text
                      and "catastro_aldia" in text
                      and "vias_publicas" in text
                  ):
                      print("OK GetCapabilities SIRI: catastro, catastro_aldia y vias_publicas detectadas.")
                      cap_ok = True
                      break
                  print(f"Intento {attempt}: capabilities sin las 3 capas o redirigido: {final_url}")
              except Exception as e:
                  print(f"Intento {attempt}: error GetCapabilities: {e}")
              time.sleep(1.5)

          if not cap_ok:
              print("AVISO: GitHub no pudo validar GetCapabilities de SIRI. La app hará la negociación automática en el dispositivo.")
              raise SystemExit(0)

          # 2) Confirmar que GetMap devuelve una imagen real antes de generar el APK.
          # BBOX pequeño en San José, Web Mercator (EPSG:3857).
          params = {
              "service": "WMS",
              "request": "GetMap",
              "version": "1.1.1",
              "layers": "catastro",
              "styles": "",
              "format": "image/png",
              "transparent": "true",
              "srs": "EPSG:3857",
              "bbox": "-9381230,1102000,-9358970,1124500",
              "width": "512",
              "height": "512",
          }
          base = "https://siri.snitcr.go.cr/Geoservicios/wms?"
          map_ok = False
          for attempt in range(1, 13):
              try:
                  url = base + urllib.parse.urlencode(params) + f"&_check={time.time_ns()}"
                  final_url, ctype, body = fetch(url)
                  png = body.startswith(b"\x89PNG\r\n\x1a\n")
                  jpg = body.startswith(b"\xff\xd8\xff")
                  if "/Geoservicios/error" not in final_url and (png or jpg):
                      print(f"OK GetMap SIRI: imagen válida recibida ({len(body)} bytes, {ctype}).")
                      map_ok = True
                      break
                  print(f"Intento {attempt}: GetMap no devolvió imagen válida: {final_url} {ctype} {len(body)} bytes")
              except Exception as e:
                  print(f"Intento {attempt}: error GetMap: {e}")
              time.sleep(1.5)

          if not map_ok:
              print("AVISO: GitHub no obtuvo GetMap de SIRI. No se bloquea la compilación; la prueba real se hará en Android.")

          # 3) Probar también el mosaico histórico de zona_catastrada.
          # Esta prueba es informativa porque el endpoint legado puede no estar disponible por HTTPS.
          legacy = (
              "https://www.snitcr.go.cr/servicios/cartografia/wms?"
              "service=WMS&request=GetMap&version=1.1.1&layers=zona_catastrada"
              "&styles=&format=image/png&transparent=true&srs=EPSG:4326"
              "&bbox=-84.20,9.85,-84.00,10.05&width=512&height=512"
          )
          try:
              final_url, ctype, body = fetch(legacy)
              if body.startswith(b"\x89PNG") or body.startswith(b"\xff\xd8\xff"):
                  print(f"OK mosaico zona_catastrada: imagen válida ({len(body)} bytes).")
              else:
                  print(f"AVISO mosaico zona_catastrada: respuesta no gráfica ({ctype}, {len(body)} bytes).")
          except Exception as e:
              print(f"AVISO mosaico zona_catastrada no disponible en esta prueba: {e}")
          PY

      - name: Preparar sonidos de campo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math, random, re, struct, urllib.request, wave

          raw = Path("app/src/main/res/raw")
          raw.mkdir(parents=True, exist_ok=True)

          SR = 44100

          def write_wav(name, samples):
              path = raw / name
              peak = max(1e-9, max(abs(x) for x in samples))
              scale = 0.985 / peak
              pcm = b"".join(struct.pack("<h", int(max(-1, min(1, x*scale))*32767)) for x in samples)
              with wave.open(str(path), "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(pcm)

          def tone(freq, dur, amp=0.8):
              n=int(SR*dur); out=[]
              for i in range(n):
                  t=i/SR
                  a=min(1,t/0.012)*min(1,max(0,(dur-t)/0.06))
                  out.append(math.sin(2*math.pi*freq*t)*amp*a)
              return out

          def silence(d):
              return [0.0]*int(SR*d)

          # FIX: tres tonos ascendentes.
          write_wav("sound_fix.wav",
                    tone(1200,0.08,0.85)+silence(0.045)+tone(1500,0.10,0.9)+silence(0.045)+tone(1800,0.12,0.95))

          # FLOAT: dos tonos iguales.
          write_wav("sound_float.wav",
                    tone(760,0.12,0.9)+silence(0.06)+tone(760,0.12,0.9))

          # AUTÓNOMO/SINGLE: un pulso grave, fuerte y un poco largo.
          n=int(SR*0.72); auto=[]
          for i in range(n):
              t=i/SR
              env=min(1,t/0.012)*min(1,max(0,(0.72-t)/0.12))
              y=(math.sin(2*math.pi*210*t)+0.24*math.sin(2*math.pi*420*t)+0.08*math.sin(2*math.pi*630*t))*env
              auto.append(math.tanh(y*1.35))
          write_wav("sound_autonomous.wav", auto)

          # Desconexión Bluetooth/NMEA: alarma larga tipo sirena.
          dur=2.2; n=int(SR*dur); alarm=[]; phase=0.0
          for i in range(n):
              t=i/SR
              modulation=0.5*(1+math.sin(2*math.pi*2.1*t))
              f=780+520*modulation
              phase += 2*math.pi*f/SR
              pulse=0.70+0.30*(0.5*(1+math.sin(2*math.pi*3.0*t)))
              alarm.append(math.sin(phase)*pulse*0.92)
          write_wav("sound_disconnected.wav", alarm)

          # Fallbacks, solo si no se puede bajar el audio real.
          write_wav("sound_connected.wav", tone(900,0.20,0.8)+silence(0.05)+tone(1200,0.25,0.9))
          random.seed(19)
          n=int(SR*0.32); mech=[]
          for i in range(n):
              t=i/SR
              noise=(random.random()*2-1)
              env=math.exp(-18*t)
              body=0.45*math.sin(2*math.pi*260*t)*math.exp(-12*t)
              mech.append((0.35*noise+body)*env)
          write_wav("sound_point_saved.wav", mech)

          def fetch_pixabay(page_url, out_name, trim_seconds=None):
              req=urllib.request.Request(page_url, headers={"User-Agent":"Mozilla/5.0"})
              html=urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
              candidates=[]
              # Pixabay pages commonly expose cdn MP3 URLs in embedded JSON/HTML.
              for pattern in [
                  r'https://cdn\.pixabay\.com/download/audio/[^"\\ ]+?\.mp3[^"\\ ]*',
                  r'https:\\u002F\\u002Fcdn\.pixabay\.com\\u002Fdownload\\u002Faudio\\u002F[^"]+?\.mp3[^"]*',
                  r'https://cdn\.pixabay\.com/audio/[^"\\ ]+?\.mp3[^"\\ ]*'
              ]:
                  candidates += re.findall(pattern, html)
              if not candidates:
                  raise RuntimeError("No se encontró URL MP3 en Pixabay")
              url=candidates[0].replace("\\u002F","/").replace("\\u0026","&").replace("\\/","/")
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=40).read()
              mp3=raw/(out_name+".mp3")
              mp3.write_bytes(data)
              print(f"Audio real descargado: {out_name} ({len(data)} bytes)")
              if trim_seconds:
                  import subprocess
                  wav=raw/(out_name+".wav")
                  subprocess.run(["ffmpeg","-y","-loglevel","error","-i",str(mp3),"-t",str(trim_seconds),"-ac","1","-ar",str(SR),str(wav)],check=True)
                  mp3.unlink(missing_ok=True)
              return True

          try:
              fetch_pixabay("https://pixabay.com/sound-effects/film-special-effects-plane-takeoff-sound-effect-521112/",
                            "sound_connected", 2.0)
          except Exception as e:
              print("AVISO: no se pudo obtener el avión real; se conserva fallback:", e)

          try:
              fetch_pixabay("https://pixabay.com/sound-effects/film-special-effects-sig-sauer-p229-handgun-slide-rack-100293/",
                            "sound_point_saved", None)
          except Exception as e:
              print("AVISO: no se pudo obtener la corredera real; se conserva fallback:", e)
          PY

      - name: Preparar firma debug estable
        run: |
          mkdir -p .ci
          base64 -d .ci/topoemlid-debug.jks.b64 > .ci/topoemlid-debug.jks

      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Verificar APK y firma
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          apksigner verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Preparar APK para descarga
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/TopoEmlid-v0.3-debug.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TopoEmlid-v0.3-debug
          path: release/TopoEmlid-v0.3-debug.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publicar APK directo en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="topoemlid-latest-debug"
          APK="release/TopoEmlid-v0.3-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Actualizando release existente $TAG"
          else
            gh release create "$TAG"               --title "TopoEmlid APK de prueba"               --notes "APK debug más reciente generado automáticamente por GitHub Actions."
          fi

          gh release upload "$TAG" "$APK" --clobber
